<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP & CTO meeting</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #dceeff;
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px;
        }

        .event-logo {
            display: block;
            width: 100%;
            max-width: 2000px;
            height: auto;
            margin: 0 auto;
        }

        .event-video {
            margin-bottom: 40px;
            width: 100%;
            max-width: 1200px;
            display: block;
            margin: 20px auto;
        }

        .welcome-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        .program-button {
            display: inline-block;
            background-color: #003366;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 18px 50px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .program-button:hover {
            background-color: #001f4d;
        }

        footer {
            margin-top: 60px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

<!-- Event Logo -->
<img src="LogoMeeting.jpg" 
    alt="Event"
    class="event-logo">
        


    <!-- Event Video -->
    <div class="video-container">
        <video controls class="event-video">
            <source src="SeeYouAtTheMeeting.MP4" type="video/mp4">
        </video>
    </div>

    <!-- Welcome Message -->
    <div class="welcome-text">
        <h2>Welcome!</h2>

        <p>
            We are delighted to welcome you to our event.
            This page contains important information, including
            the event agenda and key updates.
        </p>

        <p>
            We look forward to sharing an inspiring and engaging
            experience with you.
        </p>
    </div>

    <!-- Program Button -->
    <a href="SiteLisbonCHIPandCTOmeeting2026_08_02.pdf"
        class="program-button">
        Program
    </a>

    <footer>
        © 2026 Lisbon CHIP & CTO PCI meeting
    </footer>



</body>
</html>
